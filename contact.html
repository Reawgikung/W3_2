<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | เรียว</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><div class="wrap nav"><strong>REAW / MY PAGE</strong><a class="nav-link" href="index.html">← กลับหน้าแรก</a></div></header>
<main class="wrap contact-page"><section class="card"><p class="eyebrow">GET IN TOUCH</p><h1>ติดต่อฉัน</h1><p>กรอกข้อมูลในฟอร์มด้านล่างเพื่อเตรียมส่งข้อความ</p>
<form action="mailto:example@example.com" method="post" enctype="text/plain"><label for="name">ชื่อของคุณ</label><input id="name" name="name" type="text" placeholder="กรอกชื่อ" required><label for="email">อีเมล</label><input id="email" name="email" type="email" placeholder="you@example.com" required><label for="message">ข้อความ</label><textarea id="message" name="message" rows="6" placeholder="เขียนข้อความที่นี่..." required></textarea><button class="button" type="submit">ส่งข้อความผ่านโปรแกรมอีเมล</button></form>
<p class="muted">หมายเหตุ: เปลี่ยน example@example.com เป็นอีเมลจริงก่อนใช้งาน ฟอร์มนี้ใช้ mailto ไม่ได้บันทึกข้อมูลลงเซิร์ฟเวอร์ และต้องมีโปรแกรมอีเมลที่ตั้งค่าไว้</p></section></main>
